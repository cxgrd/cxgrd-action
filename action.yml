name: 'CXGRD Blast Radius Check'
description: 'Deterministic blast radius analysis and merge policy enforcement for AI-assisted coding workflows'
author: 'Manan'
branding:
  icon: 'radio'        # pick from Feather icons — required for Marketplace
  color: 'purple'       # one of: white, yellow, blue, green, orange, red, purple, gray-dark

inputs:
  token:
    description: 'CXGRD API token (required only for --ci enforcement on Team plan)'
    required: false
  fail-on:
    description: 'Risk level that fails the build when --ci is used: low|medium|high|critical'
    required: false
    default: 'critical'
  working-directory:
    description: 'Repository directory to analyze, relative to the GitHub workspace'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - shell: bash
      run: npm ci
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
    - shell: bash
      run: npm install -g cxgrd
    - shell: bash
      run: cxgrd scan
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
    - shell: bash
      run: cxgrd check --json > result.json
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        CXGRD_TOKEN: ${{ inputs.token }}
    - uses: actions/github-script@v7
      with:
        script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/${{ inputs.working-directory }}/result.json`, 'utf8'));

            const body = `## CXGRD Blast Radius\n # Here is the summary of the blast radius analysis:\nRisk: ${result.blastResult.riskLevel}\nAffected files: ${result.blastResult.affectedFiles.map(f => f.path).join(', ')}`;

            const marker = '<!-- cxgrd-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: `${marker}\n${body}` });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${marker}\n${body}` });
            }